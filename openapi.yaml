openapi: 3.0.3
info:
  title: Dailybase Learning Platform API
  version: 1.0.0
  description: 'Проектный контракт платформы. Лабораторная №2: Auth, Users, Students,
    Lessons, Subjects. Лабораторная №3: реализован только GET /health; остальные операции
    запланированы. Валидация будущих бизнес-запросов должна возвращать 400.'
servers:
- url: http://localhost:8000/api/v1
  description: Планируемый локальный backend
tags:
- name: Auth
  description: Публичная аутентификация
- name: Users
  description: Профиль
- name: Students
  description: Собственные учащиеся
- name: Lessons
  description: Собственное расписание
- name: Subjects
  description: Общий каталог; изменения только admin
- name: Health
  description: Реализованный liveness процесса; без проверки БД
security:
- bearerAuth: []
paths:
  /auth/register:
    post:
      tags:
      - Auth
      operationId: post_auth_register
      summary: Регистрация преподавателя
      description: Всегда создаёт роль teacher. Роль admin не принимается из запроса
        и назначается вне публичной регистрации. Нормализованный email уникален.
      x-roles:
      - Все
      responses:
        '201':
          description: Регистрация преподавателя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /auth/login:
    post:
      tags:
      - Auth
      operationId: post_auth_login
      summary: Вход и получение JWT
      description: Вход и получение JWT
      x-roles:
      - Все
      responses:
        '200':
          description: Вход и получение JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /users/me:
    get:
      tags:
      - Users
      operationId: get_users_me
      summary: Текущий пользователь
      description: Текущий пользователь
      x-roles:
      - teacher
      - admin
      responses:
        '200':
          description: Текущий пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /students:
    get:
      tags:
      - Students
      operationId: get_students
      summary: Список учащихся
      description: 'Стабильный порядок: id. Только объекты текущего преподавателя.'
      x-roles:
      - teacher
      responses:
        '200':
          description: Список учащихся
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - name: status
        in: query
        required: false
        description: Без фильтра возвращаются оба статуса.
        schema:
          type: string
          enum:
          - active
          - archived
    post:
      tags:
      - Students
      operationId: post_students
      summary: Создать учащегося
      description: teacher_id берётся из JWT; status=active. Клиент не может назначить
        владельца.
      x-roles:
      - teacher
      responses:
        '201':
          description: Создать учащегося
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
          headers:
            Location:
              description: URI созданного ресурса
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCreateRequest'
  /students/{id}:
    parameters:
    - $ref: '#/components/parameters/ResourceId'
    get:
      tags:
      - Students
      operationId: get_students_id
      summary: Получить учащегося
      description: Получить учащегося
      x-roles:
      - teacher
      responses:
        '200':
          description: Получить учащегося
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
      - Students
      operationId: put_students_id
      summary: Полностью обновить карточку учащегося
      description: Полная замена изменяемых полей; обязательны все поля Request, nullable-поля
        можно очистить значением null. Системные поля не изменяются.
      x-roles:
      - teacher
      responses:
        '200':
          description: Полностью обновить карточку учащегося
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentReplaceRequest'
    patch:
      tags:
      - Students
      operationId: patch_students_id
      summary: Частично обновить карточку учащегося
      description: Изменяются только переданные поля; пустой объект запрещён. Пропуск
        nullable-поля сохраняет значение, null очищает его. Архивирование не удаляет
        историю; новые занятия для archived запрещены.
      x-roles:
      - teacher
      responses:
        '200':
          description: Частично обновить карточку учащегося
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentPatchRequest'
    delete:
      tags:
      - Students
      operationId: delete_students_id
      summary: Удалить учащегося
      description: Физическое удаление только при отсутствии связанных записей; иначе
        409. Повторное удаление возвращает 404. Для сохранения истории используйте
        PATCH status=archived.
      x-roles:
      - teacher
      responses:
        '204':
          description: Удалить учащегося
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /lessons:
    get:
      tags:
      - Lessons
      operationId: get_lessons
      summary: Список занятий
      description: 'Стабильный порядок: starts_at, id. Только объекты текущего преподавателя.'
      x-roles:
      - teacher
      responses:
        '200':
          description: Список занятий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - name: student_id
        in: query
        required: false
        description: Фильтр по своему учащемуся.
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        required: false
        description: Начало интервала включительно.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        description: Конец интервала исключительно; должен быть позже from.
        schema:
          type: string
          format: date-time
    post:
      tags:
      - Lessons
      operationId: post_lessons
      summary: Создать занятие
      description: teacher_id берётся из JWT; status=scheduled. Учащийся должен быть
        активен и принадлежать преподавателю; предмет активен. starts_at содержит
        смещение UTC. Пересечения полуоткрытых интервалов [start,end) с неотменёнными
        занятиями преподавателя дают 409. Смежные занятия разрешены.
      x-roles:
      - teacher
      responses:
        '201':
          description: Создать занятие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonResponse'
          headers:
            Location:
              description: URI созданного ресурса
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonCreateRequest'
  /lessons/{id}:
    parameters:
    - $ref: '#/components/parameters/ResourceId'
    get:
      tags:
      - Lessons
      operationId: get_lessons_id
      summary: Получить занятие
      description: Получить занятие
      x-roles:
      - teacher
      responses:
        '200':
          description: Получить занятие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
      - Lessons
      operationId: put_lessons_id
      summary: Полностью обновить занятие
      description: Полная замена изменяемых полей; обязательны все поля Request, nullable-поля
        можно очистить значением null. Системные поля не изменяются. Только для scheduled;
        иначе 409. Повторяются проверки владельца, активных ссылок и пересечений при
        создании.
      x-roles:
      - teacher
      responses:
        '200':
          description: Полностью обновить занятие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonReplaceRequest'
    patch:
      tags:
      - Lessons
      operationId: patch_lessons_id
      summary: Частично обновить занятие
      description: 'Изменяются только переданные поля; пустой объект запрещён. Пропуск
        nullable-поля сохраняет значение, null очищает его. Переходы scheduled → completed/cancelled/missed;
        повтор того же статуса разрешён. Завершённые состояния терминальны; перенос
        и изменение остальных полей допустимы только для scheduled. Иное даёт 409.
        Отдельного статуса moved нет: меняется starts_at. Проверки создания сохраняются.'
      x-roles:
      - teacher
      responses:
        '200':
          description: Частично обновить занятие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonPatchRequest'
    delete:
      tags:
      - Lessons
      operationId: delete_lessons_id
      summary: Удалить занятие
      description: Физическое удаление только scheduled занятия без связанных учебных
        записей и уведомлений; иначе 409. Для отмены с сохранением истории используйте
        PATCH status=cancelled. Повторный DELETE возвращает 404.
      x-roles:
      - teacher
      responses:
        '204':
          description: Удалить занятие
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /subjects:
    get:
      tags:
      - Subjects
      operationId: get_subjects
      summary: Список предметов
      description: 'Стабильный порядок: id. Общий каталог предметов.'
      x-roles:
      - teacher
      - admin
      responses:
        '200':
          description: Список предметов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
    post:
      tags:
      - Subjects
      operationId: post_subjects
      summary: Создать предмет
      description: Создание записи.
      x-roles:
      - admin
      responses:
        '201':
          description: Создать предмет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectResponse'
          headers:
            Location:
              description: URI созданного ресурса
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectCreateRequest'
  /subjects/{id}:
    parameters:
    - $ref: '#/components/parameters/ResourceId'
    get:
      tags:
      - Subjects
      operationId: get_subjects_id
      summary: Получить предмет
      description: Получить предмет
      x-roles:
      - teacher
      - admin
      responses:
        '200':
          description: Получить предмет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
      - Subjects
      operationId: put_subjects_id
      summary: Полностью обновить предмет
      description: Полная замена изменяемых полей; обязательны все поля Request, nullable-поля
        можно очистить значением null. Системные поля не изменяются.
      x-roles:
      - admin
      responses:
        '200':
          description: Полностью обновить предмет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectReplaceRequest'
    patch:
      tags:
      - Subjects
      operationId: patch_subjects_id
      summary: Частично обновить предмет
      description: Изменяются только переданные поля; пустой объект запрещён. Пропуск
        nullable-поля сохраняет значение, null очищает его.
      x-roles:
      - admin
      responses:
        '200':
          description: Частично обновить предмет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectPatchRequest'
    delete:
      tags:
      - Subjects
      operationId: delete_subjects_id
      summary: Удалить предмет
      description: Физическое удаление только при отсутствии связанных записей; иначе
        409. Повторное удаление возвращает 404. Для скрытия предмета без удаления
        используйте PATCH is_active=false.
      x-roles:
      - admin
      responses:
        '204':
          description: Удалить предмет
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /health:
    get:
      tags:
      - Health
      operationId: get_health
      summary: Проверка работоспособности процесса
      description: Реализовано в лабораторной №3. Публичный liveness; не readiness.
        Uptime измеряется монотонными часами от старта экземпляра приложения.
      security: []
      responses:
        '200':
          description: Приложение отвечает
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: Ответ не должен кэшироваться
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: pass
                app_name: Dailybase Learning Platform API
                version: 1.0.0
                environment: development
                uptime_seconds: 12.345
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      - full_name
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true
        full_name:
          type: string
          minLength: 1
          maxLength: 200
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1
          writeOnly: true
    UserResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - full_name
      - role
      - is_active
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
