          example:
            code: INVALID_INPUT
            message: Неверный JSON, формат или значение параметра
            timestamp: '2026-10-21T10:00:00Z'
    Unauthorized:
      description: Токен отсутствует, истёк или неверны учётные данные
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: UNAUTHENTICATED
            message: Токен отсутствует, истёк или неверны учётные данные
            timestamp: '2026-10-21T10:00:00Z'
      headers:
        WWW-Authenticate:
          description: Схема аутентификации
          schema:
            type: string
            example: Bearer
    Forbidden:
      description: Роль не разрешает операцию или аккаунт заблокирован
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: FORBIDDEN
            message: Роль не разрешает операцию или аккаунт заблокирован
            timestamp: '2026-10-21T10:00:00Z'
    NotFound:
      description: Ресурс не найден или не принадлежит преподавателю
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: NOT_FOUND
            message: Ресурс не найден или не принадлежит преподавателю
            timestamp: '2026-10-21T10:00:00Z'
    Conflict:
      description: Конфликт состояния, зависимостей или уникальности
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: CONFLICT
            message: Конфликт состояния, зависимостей или уникальности
            timestamp: '2026-10-21T10:00:00Z'
    InternalError:
      description: Внутренняя ошибка без раскрытия технических деталей
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INTERNAL_ERROR
            message: Внутренняя ошибка без раскрытия технических деталей
            timestamp: '2026-10-21T10:00:00Z'
